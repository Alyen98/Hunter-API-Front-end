<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter x Hunter API Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: url('https://wallpapercave.com/wp/wp6949337.jpg') no-repeat center center/cover;
            min-height: 100vh;
            padding: 30px;
            backdrop-filter: blur(4px);
        }

        /* --------------------- CONTAINER ---------------------- */
        .container {
            max-width: 1200px;
            margin: auto;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
            overflow: hidden;
            border: 2px solid #00ff9d;
        }

        /* ---------------------- HEADER ----------------------- */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0e0e0e, #022d1f);
            border-bottom: 2px solid #00ff7b;
        }

        header h1 {
            font-size: 2.9rem;
            color: #00ff9d;
            text-shadow: 0 0 15px #00ff9d;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            color: #d0ffee;
        }

        /* ----------------------- TABS ------------------------- */
        .tabs {
            display: flex;
            border-bottom: 2px solid #00ff7b;
            background: rgba(0, 0, 0, 0.5);
        }

        .tab {
            flex: 1;
            padding: 18px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            color: #9affd0;
            border: none;
            font-size: 17px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .tab:hover {
            background: rgba(0, 255, 140, 0.15);
        }

        .tab.active {
            color: #00ff9d;
            background: rgba(0, 255, 140, 0.25);
            border-bottom: 3px solid #00ff9d;
        }

        /* ---------------------- CONTENT ----------------------- */
        .content {
            padding: 30px;
        }

        .section {
            display: none;
            animation: fade 0.4s ease-in-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        :root {
            --bg: #ffffff;
            --text: #111111;
        }

        .dark {
            --bg: #111111;
            --text: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s linear, color 0.3s linear;
            overflow-x: hidden;
            position: relative;
            font-family: sans-serif;
        }

        /* Botão */
        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 16px;
            border: none;
            cursor: pointer;
            background: var(--text);
            color: var(--bg);
            font-weight: bold;
            border-radius: 8px;
        }

        /* Efeito Nen */
        .nen-effect {
            position: fixed;
            width: 0;
            height: 0;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.7;
            background: radial-gradient(circle, rgba(255, 255, 255, 1), transparent);
            transform: scale(0);
            transition: transform 0.6s ease-out;
            mix-blend-mode: screen;
        }



        /* --------------------- FORM INPUTS --------------------- */
        label {
            color: #c4ffe9;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #00ff9d;
            background: rgba(0, 0, 0, 0.35);
            color: #c4ffe9;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        /* ------------------------ BUTTONS ----------------------- */
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            margin-right: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #009dff;
            color: white;
            box-shadow: 0 0 10px #009dff;
        }

        .btn-primary:hover {
            background: #007acc;
            transform: translateY(-3px);
        }

        .btn-success {
            background: #00c06b;
            color: white;
            box-shadow: 0 0 10px #00ff9d;
        }

        .btn-warning {
            background: #ffae00;
            color: white;
        }

        .btn-danger {
            background: #ff2b2b;
            color: white;
        }

        .btn-danger:hover {
            background: #cc0000;
        }

        /* ------------------ RESULTS / CARDS ------------------- */
        .results {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #00ff9d;
            border-radius: 10px;
            min-height: 80px;
            color: white;
        }

        .card-item {
            background: rgba(0, 20, 10, 0.7);
            padding: 18px;
            border-left: 5px solid #00ff9d;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .card-item h4 {
            color: #00ff9d;
            text-shadow: 0 0 10px #00ff9d;
            margin-bottom: 10px;
        }

        .card-item p {
            color: #c4ffe9;
            margin: 6px 0;
        }

        /* ---------------------- GRID --------------------------- */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        /* ------------------- ALERTS --------------------------- */
        .error {
            background: rgba(255, 0, 0, 0.25);
            padding: 12px;
            border-left: 5px solid red;
            color: #ffbaba;
            border-radius: 8px;
        }

        .success {
            background: rgba(0, 255, 100, 0.25);
            padding: 12px;
            border-left: 5px solid #00ff9d;
            color: #c4ffe9;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            color: #00ff9d;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>🎯 Hunter x Hunter API</h1>
            <p>Gerenciador completo de Hunters, Cards e Exames</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab('hunters')">Hunters</button>
            <button class="tab" onclick="showTab('cards')">Cards</button>
            <button class="tab" onclick="showTab('exams')">Exames</button>
        </div>

        <div class="content">
            <!-- API Configuration -->
            <div class="api-config">
                <label>URL Base da API:</label>
                <input type="text" id="apiUrl" value="https://hunter-8ttu.onrender.com"
                    placeholder="https://hunter-8ttu.onrender.com">

                <button id="toggleTheme" class="toggle-btn">Alternar Tema</button>
                <div class="nen-effect" id="nen"></div>

            </div>

            <!-- HUNTERS SECTION -->
            <div id="hunters" class="section active">
                <br>
                <h2>Gerenciar Hunters</h2>
                <br>
                <div class="row">
                    <div class="form-group">
                        <label>ID do Hunter (para GET/PUT/DELETE):</label>
                        <input type="number" id="hunterId" placeholder="Digite o ID">
                    </div>
                    <div class="form-group">
                        <label>Nome:</label>
                        <input type="text" id="hunterName" placeholder="Nome do Hunter (3-100 caracteres)">
                    </div>
                </div>
                <br>
                <div class="form-group">
                    <label>Idade:</label>
                    <input type="number" id="hunterAge" placeholder="Idade (mínimo 1)" min="1">
                </div>
                <br>

                <div class="actions">
                    <button class="btn btn-primary" onclick="getAllHunters()">Listar Todos</button>
                    <button class="btn btn-success" onclick="getHunterById()">Buscar por ID</button>
                    <button class="btn btn-success" onclick="createHunter()">Criar Novo</button>
                    <button class="btn btn-warning" onclick="updateHunter()">Atualizar</button>
                    <button class="btn btn-danger" onclick="deleteHunter()">Deletar</button>
                </div>

                <div id="huntersResults" class="results"></div>
            </div>

            <!-- CARDS SECTION -->
             <br>
            <div id="cards" class="section">
                <h2>Gerenciar Cards Nen</h2>

                <div class="row">
                    <div class="form-group">
                        <br>
                        <label>ID do Card (para GET/PUT/DELETE):</label>
                        <input type="number" id="cardId" placeholder="Digite o ID">
                    </div>
                    <div class="form-group">
                        <br>
                        <label>ID do Hunter (dono do card):</label>
                        <input type="number" id="cardHunterId" placeholder="ID do Hunter">
                    </div>
                </div>

                <div class="form-group">
                    <br>
                    <label>Habilidade Nen:</label>
                    <input type="text" id="cardNenAbility" placeholder="Nome da habilidade">
                </div>

                <div class="row">
                    <div class="form-group">
                        <br>
                        <label>Tipo Nen:</label>
                        <select id="cardNenType">
                            <option value="">Selecione...</option>
                            <option value="Fortificador">Fortificador</option>
                            <option value="Emissor">Emissor</option>
                            <option value="Manipulador">Manipulador</option>
                            <option value="Conjurador">Conjurador</option>
                            <option value="Transmutador">Transmutador</option>
                            <option value="Especialista">Especialista</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <br>
                        <label>Exame:</label>
                        <input type="text" id="cardExam" placeholder="Nome do exame (opcional)">
                    </div>
                </div>

                <div class="form-group">
                    <br>
                    <label>Buscar Cards (opcional):</label>
                    <input type="text" id="cardSearch" placeholder="Termo de busca">
                </div>

                <div class="actions">
                    <br>
                    <button class="btn btn-primary" onclick="getAllCards()">Listar Todos</button>
                    <button class="btn btn-primary" onclick="searchCards()">Buscar</button>
                    <button class="btn btn-success" onclick="getCardById()">Buscar por ID</button>
                    <button class="btn btn-success" onclick="createCard()">Criar Novo</button>
                    <button class="btn btn-warning" onclick="updateCard()">Atualizar</button>
                    <button class="btn btn-danger" onclick="deleteCard()">Deletar</button>
                </div>

                <div id="cardsResults" class="results"></div>
            </div>

            <!-- EXAMS SECTION -->
            <div id="exams" class="section">
                <h2>Gerenciar Exames</h2>

                <div class="row">
                    <div class="form-group">
                        <br>
                        <label>ID do Exame (para GET/PUT/DELETE):</label>
                        <input type="number" id="examId" placeholder="Digite o ID">
                    </div>
                    <div class="form-group">
                        <br>
                        <label>Nome do Exame:</label>
                        <input type="text" id="examName" placeholder="Nome do exame">
                    </div>
                </div>

                <div class="form-group">
                    <br>
                    <label>Ano do Exame:</label>
                    <input type="number" id="examYear" placeholder="Ex: 2024">
                </div>

                <div class="actions">
                    <br>
                    <button class="btn btn-primary" onclick="getAllExams()">Listar Todos</button>
                    <button class="btn btn-success" onclick="getExamById()">Buscar por ID</button>
                    <button class="btn btn-success" onclick="createExam()">Criar Novo</button>
                    <button class="btn btn-warning" onclick="updateExam()">Atualizar</button>
                    <button class="btn btn-danger" onclick="deleteExam()">Deletar</button>
                </div>

                <div id="examsResults" class="results"></div>
            </div>
        </div>
    </div>

    <script>
        const getApiUrl = () => document.getElementById('apiUrl').value;

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function showMessage(elementId, message, type = 'success') {
            const element = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : 'success';
            element.innerHTML = `<div class="${className}">${message}</div>`;
        }

        function showLoading(elementId) {
            document.getElementById(elementId).innerHTML = '<div class="loading">Carregando...</div>';
        }

        // HUNTERS FUNCTIONS
        async function getAllHunters() {
            showLoading('huntersResults');
            try {
                const response = await fetch(`${getApiUrl()}/hunters`);
                const data = await response.json();
                displayHunters(data);
            } catch (error) {
                showMessage('huntersResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function getHunterById() {
            const id = document.getElementById('hunterId').value;
            if (!id) {
                showMessage('huntersResults', 'Por favor, insira um ID', 'error');
                return;
            }

            showLoading('huntersResults');
            try {
                const response = await fetch(`${getApiUrl()}/hunters/${id}`);
                if (!response.ok) throw new Error('Hunter não encontrado');
                const data = await response.json();
                displayHunters([data]);
            } catch (error) {
                showMessage('huntersResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function createHunter() {
            const name = document.getElementById('hunterName').value;
            const age = document.getElementById('hunterAge').value;

            if (!name || !age) {
                showMessage('huntersResults', 'Preencha nome e idade', 'error');
                return;
            }

            const hunter = { name, age: parseInt(age) };

            showLoading('huntersResults');
            try {
                const response = await fetch(`${getApiUrl()}/hunters`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(hunter)
                });

                if (!response.ok) throw new Error('Erro ao criar hunter');
                showMessage('huntersResults', 'Hunter criado com sucesso!');
                setTimeout(getAllHunters, 1000);
            } catch (error) {
                showMessage('huntersResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function updateHunter() {
            const id = document.getElementById('hunterId').value;
            const name = document.getElementById('hunterName').value;
            const age = document.getElementById('hunterAge').value;

            if (!id || !name || !age) {
                showMessage('huntersResults', 'Preencha ID, nome e idade', 'error');
                return;
            }

            const hunter = { name, age: parseInt(age) };

            showLoading('huntersResults');
            try {
                const response = await fetch(`${getApiUrl()}/hunters/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(hunter)
                });

                if (!response.ok) throw new Error('Erro ao atualizar hunter');
                showMessage('huntersResults', 'Hunter atualizado com sucesso!');
                setTimeout(getAllHunters, 1000);
            } catch (error) {
                showMessage('huntersResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function deleteHunter() {
            const id = document.getElementById('hunterId').value;
            if (!id) {
                showMessage('huntersResults', 'Por favor, insira um ID', 'error');
                return;
            }

            if (!confirm('Tem certeza que deseja deletar este hunter?')) return;

            showLoading('huntersResults');
            try {
                const response = await fetch(`${getApiUrl()}/hunters/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Erro ao deletar hunter');
                showMessage('huntersResults', 'Hunter deletado com sucesso!');
                setTimeout(getAllHunters, 1000);
            } catch (error) {
                showMessage('huntersResults', `Erro: ${error.message}`, 'error');
            }
        }

        function displayHunters(hunters) {
            const resultsDiv = document.getElementById('huntersResults');
            if (!hunters || hunters.length === 0) {
                resultsDiv.innerHTML = '<p>Nenhum hunter encontrado</p>';
                return;
            }

            let html = '<h3>Hunters:</h3>';
            hunters.forEach(hunter => {
                html += `
                    <div class="card-item">
                        <h4>🎯 ${hunter.name || 'Sem nome'}</h4>
                        <p><strong>ID:</strong> ${hunter.id}</p>
                        <p><strong>Idade:</strong> ${hunter.age || 'N/A'}</p>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }

        // CARDS FUNCTIONS
        async function getAllCards() {
            showLoading('cardsResults');
            try {
                const response = await fetch(`${getApiUrl()}/cards`);
                const data = await response.json();
                displayCards(data);
            } catch (error) {
                showMessage('cardsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function searchCards() {
            const query = document.getElementById('cardSearch').value;
            showLoading('cardsResults');
            try {
                const url = query
                    ? `${getApiUrl()}/cards/search?q=${encodeURIComponent(query)}`
                    : `${getApiUrl()}/cards/search`;
                const response = await fetch(url);
                const data = await response.json();
                displayCards(data.cards || data);
            } catch (error) {
                showMessage('cardsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function getCardById() {
            const id = document.getElementById('cardId').value;
            if (!id) {
                showMessage('cardsResults', 'Por favor, insira um ID', 'error');
                return;
            }

            showLoading('cardsResults');
            try {
                const response = await fetch(`${getApiUrl()}/cards/${id}`);
                if (!response.ok) throw new Error('Card não encontrado');
                const data = await response.json();
                displayCards([data]);
            } catch (error) {
                showMessage('cardsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function createCard() {
            const hunterId = document.getElementById('cardHunterId').value;
            const nenAbility = document.getElementById('cardNenAbility').value;
            const nenType = document.getElementById('cardNenType').value;
            const exam = document.getElementById('cardExam').value;

            if (!hunterId || !nenAbility || !nenType) {
                showMessage('cardsResults', 'Preencha Hunter ID, habilidade e tipo Nen', 'error');
                return;
            }

            const card = {
                nenAbility,
                nenType,
                exam: exam || null,
                hunter: { id: parseInt(hunterId) }
            };

            showLoading('cardsResults');
            try {
                const response = await fetch(`${getApiUrl()}/cards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(card)
                });

                if (!response.ok) throw new Error('Erro ao criar card');
                showMessage('cardsResults', 'Card criado com sucesso!');
                setTimeout(getAllCards, 1000);
            } catch (error) {
                showMessage('cardsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function updateCard() {
            const id = document.getElementById('cardId').value;
            const hunterId = document.getElementById('cardHunterId').value;
            const nenAbility = document.getElementById('cardNenAbility').value;
            const nenType = document.getElementById('cardNenType').value;
            const exam = document.getElementById('cardExam').value;

            if (!id || !hunterId || !nenAbility || !nenType) {
                showMessage('cardsResults', 'Preencha todos os campos obrigatórios', 'error');
                return;
            }

            const card = {
                nenAbility,
                nenType,
                exam: exam || null,
                hunter: { id: parseInt(hunterId) }
            };

            showLoading('cardsResults');
            try {
                const response = await fetch(`${getApiUrl()}/cards/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(card)
                });

                if (!response.ok) throw new Error('Erro ao atualizar card');
                showMessage('cardsResults', 'Card atualizado com sucesso!');
                setTimeout(getAllCards, 1000);
            } catch (error) {
                showMessage('cardsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function deleteCard() {
            const id = document.getElementById('cardId').value;
            if (!id) {
                showMessage('cardsResults', 'Por favor, insira um ID', 'error');
                return;
            }

            if (!confirm('Tem certeza que deseja deletar este card?')) return;

            showLoading('cardsResults');
            try {
                const response = await fetch(`${getApiUrl()}/cards/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Erro ao deletar card');
                showMessage('cardsResults', 'Card deletado com sucesso!');
                setTimeout(getAllCards, 1000);
            } catch (error) {
                showMessage('cardsResults', `Erro: ${error.message}`, 'error');
            }
        }

        function displayCards(cards) {
            const resultsDiv = document.getElementById('cardsResults');
            if (!cards || cards.length === 0) {
                resultsDiv.innerHTML = '<p>Nenhum card encontrado</p>';
                return;
            }

            let html = '<h3>Cards Nen:</h3>';
            cards.forEach(card => {
                html += `
                    <div class="card-item">
                        <h4>⚡ ${card.nenability || card.nenAbility || 'Sem habilidade'}</h4>
                        <p><strong>ID:</strong> ${card.id}</p>
                        <p><strong>Hunter:</strong> ${card.hunterName || card.hunter?.name || 'N/A'}</p>
                        <p><strong>Tipo Nen:</strong> ${card.nentype || card.nenType || 'N/A'}</p>
                        <p><strong>Exame:</strong> ${card.exam || 'N/A'}</p>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }

        // EXAMS FUNCTIONS
        async function getAllExams() {
            showLoading('examsResults');
            try {
                const response = await fetch(`${getApiUrl()}/exams`);
                const data = await response.json();
                displayExams(data);
            } catch (error) {
                showMessage('examsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function getExamById() {
            const id = document.getElementById('examId').value;
            if (!id) {
                showMessage('examsResults', 'Por favor, insira um ID', 'error');
                return;
            }

            showLoading('examsResults');
            try {
                const response = await fetch(`${getApiUrl()}/exams/${id}`);
                if (!response.ok) throw new Error('Exame não encontrado');
                const data = await response.json();
                displayExams([data]);
            } catch (error) {
                showMessage('examsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function createExam() {
            const name = document.getElementById('examName').value;
            const examYear = document.getElementById('examYear').value;

            if (!name) {
                showMessage('examsResults', 'Preencha o nome do exame', 'error');
                return;
            }

            const exam = {
                name,
                examYear: examYear ? parseInt(examYear) : null
            };

            showLoading('examsResults');
            try {
                const response = await fetch(`${getApiUrl()}/exams`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(exam)
                });

                if (!response.ok) throw new Error('Erro ao criar exame');
                showMessage('examsResults', 'Exame criado com sucesso!');
                setTimeout(getAllExams, 1000);
            } catch (error) {
                showMessage('examsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function updateExam() {
            const id = document.getElementById('examId').value;
            const name = document.getElementById('examName').value;
            const examYear = document.getElementById('examYear').value;

            if (!id || !name) {
                showMessage('examsResults', 'Preencha ID e nome', 'error');
                return;
            }

            const exam = {
                name,
                examYear: examYear ? parseInt(examYear) : null
            };

            showLoading('examsResults');
            try {
                const response = await fetch(`${getApiUrl()}/exams/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(exam)
                });

                if (!response.ok) throw new Error('Erro ao atualizar exame');
                showMessage('examsResults', 'Exame atualizado com sucesso!');
                setTimeout(getAllExams, 1000);
            } catch (error) {
                showMessage('examsResults', `Erro: ${error.message}`, 'error');
            }
        }

        async function deleteExam() {
            const id = document.getElementById('examId').value;
            if (!id) {
                showMessage('examsResults', 'Por favor, insira um ID', 'error');
                return;
            }

            if (!confirm('Tem certeza que deseja deletar este exame?')) return;

            showLoading('examsResults');
            try {
                const response = await fetch(`${getApiUrl()}/exams/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Erro ao deletar exame');
                showMessage('examsResults', 'Exame deletado com sucesso!');
                setTimeout(getAllExams, 1000);
            } catch (error) {
                showMessage('examsResults', `Erro: ${error.message}`, 'error');
            }
        }

        const btn = document.getElementById("toggleTheme");
        const nen = document.getElementById("nen");
        let darkMode = false;

        btn.addEventListener("click", (e) => {
            const x = e.clientX;
            const y = e.clientY;

            // Define a posição inicial do efeito
            nen.style.left = `${x}px`;
            nen.style.top = `${y}px`;

            // Expande o Nen (energia)
            nen.style.transform = "scale(1)";

            // Troca o tema levemente atrasado para casar com a expansão
            setTimeout(() => {
                document.body.classList.toggle("dark");
            }, 100);

            // Recolhe o Nen depois do efeito
            setTimeout(() => {
                nen.style.transform = "scale(0)";
            }, 600);
        });


        function displayExams(exams) {
            const resultsDiv = document.getElementById('examsResults');
            if (!exams || exams.length === 0) {
                resultsDiv.innerHTML = '<p>Nenhum exame encontrado</p>';
                return;
            }

            let html = '<h3>Exames:</h3>';
            exams.forEach(exam => {
                html += `
                    <div class="card-item">
                        <h4>📋 ${exam.name || 'Sem nome'}</h4>
                        <p><strong>ID:</strong> ${exam.id}</p>
                        <p><strong>Ano:</strong> ${exam.examYear || 'N/A'}</p>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }
    </script>
</body>

</html>
